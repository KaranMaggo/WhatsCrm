
name: Migrations

# Replaces the old Supabase Preview check.
# Starts a clean local database and replays migrations.
# No production database credentials are required.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Start Postgres
        run: supabase db start

      # Rebuild the local database and apply migrations.
      - name: Replay every migration from scratch
        run: supabase db reset --local --no-seed

      # Identify missing functions and inspect execution permissions.
      # This step is read-only and does not modify database grants.
      - name: Diagnose internal function permissions
        run: |
          cat > /tmp/check-function-grants.sql <<'SQL'
          DO $$
          DECLARE
            fn text;
            fn_oid regprocedure;
          BEGIN
            FOREACH fn IN ARRAY ARRAY[
              'public.bcast_bump(uuid,text,integer)',
              'public.recompute_broadcast_counts(uuid)',
              'public.claim_ai_reply_slot(uuid,integer)',
              'public.record_webhook_failure(uuid,integer)',
              'public.merge_duplicate_contacts()',
              'public.merge_duplicate_conversations()'
            ]
            LOOP
              fn_oid := to_regprocedure(fn);

              IF fn_oid IS NULL THEN
                RAISE NOTICE 'MISSING FUNCTION: %', fn;
              ELSE
                RAISE NOTICE
                  'Function: %, anon: %, authenticated: %, service_role: %',
                  fn,
                  has_function_privilege('anon', fn_oid, 'EXECUTE'),
                  has_function_privilege('authenticated', fn_oid, 'EXECUTE'),
                  has_function_privilege('service_role', fn_oid, 'EXECUTE');
              END IF;
            END LOOP;
          END $$;
          SQL

          supabase db query --local --file /tmp/check-function-grants.sql

      # Validate the final schema and security requirements.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql

# Re-run corrected migration diagnostics.
